name: Deploy AI Fact-Check Portfolio & Neon DB Sync

on:
  workflow_dispatch:
  schedule:
    # 🌟 1일 4회(6시간 주기) 전략 수집 + 23:30 EOD 최종 감사
    # 1회차 00:17 KST (UTC 15:17) - 심야 글로벌 릴리스
    # 2회차 06:17 KST (UTC 21:17) - 모닝 브리핑
    # 3회차 12:17 KST (UTC 03:17) - 정오 레이더
    # 4회차 18:17 KST (UTC 09:17) - 저녁 라운드업
    # + 23:30 KST: daily_eod_enrichment.yml (EOD 전수 배치 감사)
    - cron: '17 3,9,15,21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      NEON_KEY: ${{ secrets.NEON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Hydrate Inbox from Neon Postgres DB (Scheduled/Manual Only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python tools/db_bridge.py --pull-inbox || echo "Pull from Neon DB completed or skipped."

      - name: Run Multi-Source Trend Harvester (Scheduled/Manual Only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEON_KEY: ${{ secrets.NEON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
        run: |
          python -u tools/harvest_trends.py

      - name: Real-Time AI Enrichment (Scheduled/Manual Only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NEON_KEY: ${{ secrets.NEON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
        run: |
          python -u tools/enrich_inbox_with_ai.py --only-new --limit 35 --batch-size 3 --workers 1 --cooldown 0.5 --provider openrouter || echo "AI enrichment completed with fallback."

      - name: Sync Data to Neon Postgres Cloud DB (Scheduled/Manual Only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python tools/db_bridge.py --sync-inbox && python tools/db_bridge.py --sync-factchecks || echo "Neon DB sync skipped or completed with notes."

      - name: Sync GitHub Actions Telemetry to Neon DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sync_actions_telemetry.py || echo "Actions telemetry sync skipped."

      - name: Build Fact-Check Portfolio Dashboard & Docs
        run: |
          python tools/build_dashboard.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (docs directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Finalize Actions Telemetry in Neon DB
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sync_actions_telemetry.py --finalize --run-id ${{ github.run_id }} --job-status ${{ job.status }} || echo "Telemetry finalize skipped"
