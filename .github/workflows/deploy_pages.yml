name: Deploy AI Fact-Check Portfolio & Neon DB Sync

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    # 🌟 3시간 단위 정기 자동 수집 및 Neon DB 동기화
    # 한국시간(KST, UTC+9) 기준: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 정각
    # UTC 기준: 15:00, 18:00, 21:00, 00:00, 03:00, 06:00, 09:00, 12:00
    - cron: '0 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEON_KEY: ${{ secrets.NEON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install psycopg2-binary requests pyyaml google-genai

      - name: Harvest Completed Gemini Batch Jobs & Apply Results (50% Cost Cut)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_KEY: ${{ secrets.NEON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
        run: |
          python tools/enrich_inbox_with_ai.py --harvest-batch || echo "Harvest batch completed or skipped."

      - name: Run Multi-Source Trend Harvester
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_KEY: ${{ secrets.NEON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
        run: |
          python tools/harvest_trends.py

      - name: Submit Newly Harvested Items to Gemini Batch API (50% Cost Cut)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEON_KEY: ${{ secrets.NEON_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
        run: |
          python tools/enrich_inbox_with_ai.py --submit-batch --limit 100 || echo "Submit batch completed or skipped."

      - name: Auto-Factcheck Queued Investigation Items with Token Ledger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/factcheck_worker.py --limit 3 || echo "Autonomous factcheck worker completed or skipped."

      - name: Sync Data to Neon Postgres Cloud DB
        run: |
          python tools/db_bridge.py --sync-all || echo "Neon DB sync skipped or completed with notes."

      - name: Build Fact-Check Portfolio Dashboard & Docs
        run: |
          python tools/build_dashboard.py

      - name: Commit & Push Harvested Updates to Git (if any)
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add inbox/ docs/ dashboard/ logs/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-harvest): Daily multi-source trend collection & Neon DB sync"
            git pull origin main --rebase --autostash || true
            git push origin main || echo "Push rejected or already up-to-date, proceeding to deployment."
          else
            echo "No staged changes to commit."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (docs directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
