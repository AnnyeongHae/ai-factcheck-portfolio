name: Build & Deploy Pages (Code Push Only)

# Triggered ONLY on manual code changes (investigations/, tools/, etc.)
# Does NOT run data collection or AI enrichment.
# Keeps GitHub Pages up-to-date when dossiers or code are updated manually.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '.gemini/**'
      - 'logs/**'
      - '*.md'
      - 'inbox/**'
      - 'public/**'
      - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      NEON_KEY: ${{ secrets.NEON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Fact-Check Portfolio Dashboard
        run: python tools/build_dashboard.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (docs directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
