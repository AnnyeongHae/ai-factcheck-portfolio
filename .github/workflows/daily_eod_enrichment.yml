name: Daily 23:30 KST End-of-Day Batch Enrichment & Final Audit

on:
  schedule:
    # Runs everyday at 14:37 UTC = 23:37 KST (Korea Standard Time) - shifted from :30 to bypass GitHub Actions runner queue congestion
    - cron: '37 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  daily-eod-batch:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NEON_KEY: ${{ secrets.NEON_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.NEON_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Hydrate Inbox from Neon Postgres DB
        run: |
          python tools/db_bridge.py --pull-inbox || echo "Pull from Neon DB completed or skipped."

      - name: Run Daily 23:30 EOD Batch Ingestion & Harvest (Zero Left Behind)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python -u tools/daily_eod_enrichment.py

      - name: Sync Data to Neon Postgres Cloud DB
        run: |
          python tools/db_bridge.py --sync-inbox && python tools/db_bridge.py --sync-factchecks || echo "Neon DB sync skipped or completed with notes."

      - name: Sync GitHub Actions Telemetry to Neon DB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sync_actions_telemetry.py || echo "Actions telemetry sync skipped."

      - name: Build Fact-Check Portfolio Dashboard & Docs
        run: |
          python tools/build_dashboard.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact (docs directory)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Finalize Actions Telemetry in Neon DB
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/sync_actions_telemetry.py --finalize --run-id ${{ github.run_id }} --job-status ${{ job.status }} || echo "Telemetry finalize skipped"
