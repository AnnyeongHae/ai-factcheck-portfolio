<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- AI Circuit Accent Dots -->
  <circle cx="16" cy="18" r="2" fill="#06b6d4" opacity="0.8"/>
  <circle cx="48" cy="18" r="2" fill="#6366f1" opacity="0.8"/>
  <path d="M18 18h8M46 18h-8" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shield Shape with Glowing Gradient -->
  <path d="M32 12 L48 18 C48 32, 39 46, 32 52 C25 46, 16 32, 16 18 Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"/>

  <!-- Inner Dark Shield -->
  <path d="M32 15 L45 20 C45 31, 38 43, 32 48 C26 43, 19 31, 19 20 Z" 
        fill="#0b0f19" 
        opacity="0.92"/>

  <!-- Verified Checkmark with AI Star -->
  <path d="M26 31 L30.5 35.5 L38.5 24.5" 
        fill="none" 
        stroke="#10b981" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Sparkling Insight Node -->
  <circle cx="32" cy="42" r="2" fill="#38bdf8"/>
</svg>