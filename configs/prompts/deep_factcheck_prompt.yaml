    "portfolio_story": {
      "the_hook": "이 기술을 왜 주목해야 하는지에 대한 결정적 1줄 공학 훅 (한국어)",
      "the_hook_zh": "直击工程师痛点的 1 句话核心价值 (中文)",
      "the_hook_en": "Compelling 1-line hook for engineers (English)",
      "marketing_hype_anatomy": "바이럴 마케팅의 과장된 수치 이면에 숨겨진 엔지니어링 실체 해부",
      "engineering_takeaways": "1. 첫 번째 교훈\n2. 두 번째 교훈\n3. 세 번째 교훈",
      "future_applications": "실제 엔터프라이즈 환경에서의 구체적 응용 방안",
