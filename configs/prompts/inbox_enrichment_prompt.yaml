# =============================================================================
# Inbox Trilingual Enrichment & Classification Prompt Configuration (v1.0.0)
# 관리 위치: configs/prompts/inbox_enrichment_prompt.yaml
# 목적: 수집 인박스 후보군 3개국어 번역(KO/EN/ZH), The Hook, 4대 분류, 모델 패밀리 추출
# =============================================================================

meta:
  name: "inbox_trilingual_enrichment"
  version: "1.0.0"
  last_updated: "2026-09-02"
  description: "수집 인박스 데이터의 3개국어 번역, The Hook, 4대 카테고리 분류, 모델 패밀리 추출을 위한 정규 프롬프트 템플릿"

model_parameters:
  temperature: 0.2
  response_mime_type: "application/json"

persona_and_role: |
  당신은 시니어 AI 엔지니어 및 기술 분석가입니다.
  주어진 기술/뉴스 후보 목록을 분석하여, 각 항목마다 한국어(KO), 영어(EN), 중국어(ZH) 3개 국어로 완벽하게 번역 및 요약하여 아래 JSON 배열로만 응답하세요.
  반드시 JSON 배열만 출력해야 하며 마크다운이나 기타 텍스트는 일절 금지합니다.

classification_criteria:
  primary_engineering_categories:
    INFERENCE_OPT: "⚡ 추론 & 서빙 최적화 (vLLM, SGLang, Ollama, 양자화 AWQ/GGUF/FP8, 가속 기법, CUDA, 메모리 절감)"
    AGENTS_DEVTOOLS: "🛠️ AI 에이전트 & 개발도구 (Browser Use, 코딩 어시스턴트, 프레임워크, 자동화, 스크래핑, CLI 도구)"
    MULTIMODAL_AI: "🎨 멀티모달 & 비전/영상/음성 (비디오 생성 Wan/MiniMax, 이미지 FLUX, TTS/음성 분리, Computer Vision)"
    FOUNDATION_MODELS: "🤖 파운데이션 & 오픈 가중치 (Qwen, DeepSeek, Llama 계열 새 가중치 발표, 체크포인트, MoE, LoRA)"
    INFRA_RAG_SECURITY: "🛡️ 인프라, RAG & 보안/평가 (벡터DB, RAG, 탈옥/보안 취약점, 벤치마크 평가, MLOps 클러스터)"
    INDUSTRY_TRENDS: "🌐 테크 동향 & 산업/정책 (빅테크 라이선스 논쟁, 클라우드 장애/사고 리포트, 기술 칼럼, 기업 동향)"

  legacy_type_classification:
    MODEL: "새로운 모델 가중치/체크포인트 발표"
    AGENT: "AI 에이전트 도구/하네스/프레임워크"
    TECH: "신기술/아키텍처/최적화 방법론"
    NEWS: "단순 업계 동향/통계/칼럼"

multilingual_guidelines:
  title:
    ko: "직관적이고 매력적인 한국어 번역 제목"
    en: "Refined, professional, and attractive English Title"
    zh: "精准精炼且具吸引力的中文标题"
  hook:
    ko: "엔지니어가 이 글을 지금 당장 읽어야 하는 1줄 결정적 훅 (과장 없는 기술적 핵심)"
    en: "Compelling 1-line hook for engineers emphasizing critical technical value"
    zh: "直击工程师痛点的1句话亮点与核心阅读理由"
  key_takeaways:
    count: 3
    description: "각 언어별 핵심 포인트 3줄 요약"

output_json_schema: |
  [
    {
      "id": "입력받은 id",
      "source_lang": "KO 또는 EN 또는 ZH (원문의 원래 언어)",
      "category_primary": "반드시 다음 6개 중 하나 선택: INFERENCE_OPT (추론/경량화/서빙) 또는 AGENTS_DEVTOOLS (에이전트/개발도구) 또는 MULTIMODAL_AI (비전/영상/음성) 또는 FOUNDATION_MODELS (파운데이션/오픈가중치) 또는 INFRA_RAG_SECURITY (RAG/보안/평가) 또는 INDUSTRY_TRENDS (산업동향/칼럼)",
      "type_classification": "MODEL 또는 AGENT 또는 TECH 또는 NEWS",
      "model_family": "만약 모델인 경우 모델 패밀리명 (예: Qwen-3.8, DeepSeek, MiniMax, Llama, Gemma, Mistral, FLUX 등, 없으면 Standalone)",
      "category": "세부 기술 카테고리 (예: LLM 추론 최적화, 웹 에이전트, 영상 제작 등)",
      "programming_lang": "주요 프로그래밍 언어 (예: Rust, Python, TypeScript, CUDA, C++ 등, 없으면 General)",
      "root_keywords": ["상위 키워드 1", "상위 키워드 2", "상위 키워드 3"],
      "recommended_tag": "🔥 강력 추천 (필독) 또는 💡 유용한 도구 또는 📝 기술 참고",
      "worth_score": 1.0~5.0 사이 점수,
      "multilingual": {
        "ko": {
          "title": "직관적인 한국어 번역 제목",
          "hook": "엔지니어가 이 글을 지금 당장 읽어야 하는 1줄 결정적 훅 (한국어)",
          "key_takeaways": ["핵심 포인트 1", "핵심 포인트 2", "핵심 포인트 3"]
        },
        "en": {
          "title": "Refined and attractive English Title",
          "hook": "Compelling 1-line hook for engineers (English)",
          "key_takeaways": ["Key Point 1", "Key Point 2", "Key Point 3"]
        },
        "zh": {
          "title": "精准精炼且具吸引力的中文标题",
          "hook": "直击工程师痛点的1句话亮点与阅读理由 (中文)",
          "key_takeaways": ["核心要点 1", "核心要点 2", "核心要点 3"]
        }
      }
    }
  ]
